name: Animation smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config
      - name: Install animation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Render short animation
        run: |
          manim -ql --fps 24 src/stixplainer/scenes/smoke_test.py StudioSmokeTest
      - name: Upload rendered proof
        uses: actions/upload-artifact@v4
        with:
          name: stixplainer-animation-smoke-test
          path: media/videos/smoke_test/480p24/StudioSmokeTest.mp4
          if-no-files-found: error
          retention-days: 3
