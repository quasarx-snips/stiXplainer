name: stiXplainer pilot build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "requirements.txt"
      - "subtitles.srt"
      - "script.md"
      - "sources.md"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install animation system libraries
        run: sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config
      - name: Install animation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Render stickman pilot at 1080p and 24 fps
        run: manim -qh --fps 24 src/stixplainer/scenes/pilot.py UrbanHeatIslandPilot
      - name: Upload pilot animation
        uses: actions/upload-artifact@v4
        with:
          name: stixplainer-pilot-animation
          path: media/videos/pilot/1080p24/UrbanHeatIslandPilot.mp4
          if-no-files-found: error
          retention-days: 3

  voiceover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install British English voice dependencies
        run: |
          sudo apt-get install -y espeak-ng
          python -m pip install --upgrade pip
          python -m pip install "kokoro>=0.9.4" soundfile
      - name: Generate British male narration (bm_george)
        run: python scripts/generate_narration.py
      - name: Upload narration WAV
        uses: actions/upload-artifact@v4
        with:
          name: stixplainer-narration
          path: artifacts/narration.wav
          if-no-files-found: error
          retention-days: 3

  assemble:
    needs: [render, voiceover]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg
      - name: Download rendered animation
        uses: actions/download-artifact@v4
        with:
          name: stixplainer-pilot-animation
          path: media/videos/pilot/1080p24
      - name: Download narration
        uses: actions/download-artifact@v4
        with:
          name: stixplainer-narration
          path: artifacts
      - name: Assemble final MP4 with captions
        run: python scripts/assemble_pilot.py
      - name: Upload final documentary MP4 and source audio
        uses: actions/upload-artifact@v4
        with:
          name: stixplainer-final-pilot
          path: |
            artifacts/final_video.mp4
            artifacts/narration.wav
            subtitles.srt
            script.md
            sources.md
          if-no-files-found: error
          retention-days: 7
