name: Animation smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system libraries
        run: |
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config
      - name: Install animation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Render short animation proof
        run: |
          manim -ql --fps 24 src/stixplainer/scenes/smoke_test.py StudioSmokeTest
      - name: Render first documentary pilot scene
        run: |
          manim -ql --fps 24 src/stixplainer/scenes/pilot.py UrbanHeatIslandPilot
      - name: Upload rendered videos
        uses: actions/upload-artifact@v4
        with:
          name: stixplainer-animation-renders
          path: |
            media/videos/smoke_test/480p24/StudioSmokeTest.mp4
            media/videos/pilot/480p24/UrbanHeatIslandPilot.mp4
          if-no-files-found: error
          retention-days: 3

  british-voiceover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install voice dependencies
        run: |
          sudo apt-get install -y espeak-ng
          python -m pip install --upgrade pip
          python -m pip install "kokoro>=0.9.4" soundfile
      - name: Generate British male narration
        run: python scripts/generate_narration.py
      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: stixplainer-british-narration
          path: artifacts/narration.wav
          if-no-files-found: error
          retention-days: 3
