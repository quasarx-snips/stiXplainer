[project]
name = "stiXplainer"
default_language = "en-GB"
budget_inr = 0
allow_subscriptions = false
allow_paid_credits = false
allow_trials = false
allow_paid_fallbacks = false

[format]
aspect_ratio = "16:9"
width = 1920
height = 1080
fps = 24
pilot_min_seconds = 60
pilot_max_seconds = 90
documentary_min_minutes = 10
documentary_max_minutes = 15

[narration]
language = "en-GB"
voice_direction = "British English male storyteller"
delivery = "warm, clear, natural, measured"
reference_audio = false
subtitles_file = "subtitles.srt"

[visual]
style_bible = "docs/visual-style-bible.md"
medium = "hand-drawn-style 2D stickman explainer"
outline = "organic near-black hand-drawn linework"
lead_character = "original recurring stick figure with pale round head, expressive face, thin dark limbs, blue top and blue or neutral trousers"
supporting_cast = "simple original supporting stick figures, differentiated by clothing, hair, props and posture"
backgrounds = "illustrated environments with simplified foreground, middle ground and background"
explanatory_inserts = ["object illustration", "animal illustration", "cross-section", "timeline", "scale comparison", "labelled diagram"]
on_screen_text = "short hand-lettered headings and labels"
subtitle_bars_burned_in = false
photo_inserts_default = false
copy_reference_artwork = false

[animation]
story_over_slideshow = true
animate_character_body_language = true
animate_facial_expressions = true
animate_relevant_environment = true
use_purposeful_camera_moves = true
avoid_static_scene_padding = true

[audio]
music_requires_documented_rights = true
sound_effects_are_selective = true
deliver_narration_wav = true
deliver_subtitles_srt = true

[deliverables]
video = "final_video.mp4"
narration = "narration.wav"
subtitles = "subtitles.srt"
script = "script.md"
sources = "sources.md"
thumbnail = "thumbnail.png"
qc_report = "qc-report.md"

[approval]
owner_is_creative_director = true
approval_required_for_new_default_character = true
approval_required_for_unclear_asset_rights = true
approval_required_for_spending = true
approval_required_for_public_release = true
